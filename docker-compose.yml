services:
  necom-database:
    image: mysql:8.0
    container_name: necom-database
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-necom}
      MYSQL_USER: ${MYSQL_USER:-necom}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-necom}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./necom-server/src/main/resources/address.sql:/docker-entrypoint-initdb.d/01-address.sql
      - ./necom-server/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql
      - ./necom-server/src/main/resources/data.sql:/docker-entrypoint-initdb.d/03-data.sql
      - ./necom-server/src/main/resources/home-living-seed.sql:/docker-entrypoint-initdb.d/04-home-living-seed.sql
      - ./necom-server/src/main/resources/chat-migration.sql:/docker-entrypoint-initdb.d/05-chat-migration.sql
      - ./necom-server/src/main/resources/chatbot-migration.sql:/docker-entrypoint-initdb.d/06-chatbot-migration.sql
      - ./necom-server/src/main/resources/address-migration-2025.sql:/docker-entrypoint-initdb.d/07-address-migration-2025.sql
      - ./necom-server/src/main/resources/catalog-seed.sql:/docker-entrypoint-initdb.d/08-catalog-seed.sql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --character-set-client-handshake=FALSE --init-connect='SET NAMES utf8mb4'

  necom-server:
    container_name: necom-server
    build:
      context: ./necom-server
      dockerfile: Dockerfile
    image: necom-server:latest
    environment:
      JAVA_OPTS: ${JAVA_OPTS:--Xmx384m -Xms192m}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      BACKEND_HOST: ${BACKEND_HOST:-http://localhost:8085}
      SPRING_DATASOURCE_URL: jdbc:mysql://necom-database:3306/necom?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&sessionVariables=sql_mode='STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION'
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-necom}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-necom}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-ci}
      SPRING_SQL_INIT_MODE: ${SPRING_SQL_INIT_MODE:-never}
      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET:-necom-production-jwt-secret-key-must-be-long-and-secure-for-hs512-compliance-2026}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-10080000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-86400000}
      # Mail Configuration
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # PayPal Configuration (Sandbox)
      PAYPAL_BASE_URL: ${PAYPAL_BASE_URL:-https://api-m.sandbox.paypal.com}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_SECRET: ${PAYPAL_SECRET:-}
      # GHN Configuration (Dev)
      GHN_TOKEN: ${GHN_TOKEN:-}
      GHN_SHOP_ID: ${GHN_SHOP_ID:-}
      GHN_API_PATH: ${GHN_API_PATH:-https://dev-online-gateway.ghn.vn/shiip/public-api/v2}
      # Chatbot CSKH (giá trị thật chỉ nằm trong .env, không commit)
      CHATBOT_ENABLED: ${CHATBOT_ENABLED:-true}
      CHATBOT_BASE_URL: ${CHATBOT_BASE_URL:-}
      CHATBOT_API_KEY: ${CHATBOT_API_KEY:-}
      CHATBOT_MODEL: ${CHATBOT_MODEL:-}
      # Embedding nội bộ cho tìm kiếm ngữ nghĩa (để trống để tắt)
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://necom-embedding:80}
    # Cho phép container gọi dịch vụ chạy trên máy host (vd. AI proxy) qua host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${SERVER_PORT:-8085}:8085"

    depends_on:
      necom-database:
        condition: service_healthy
    networks:
      - backend
    restart: always

  # Embedding đa ngôn ngữ (multilingual-e5-small ONNX int8, ~250MB RAM) cho tìm kiếm sản phẩm ngữ nghĩa, chỉ mở trong mạng nội bộ
  necom-embedding:
    container_name: necom-embedding
    build:
      context: ./necom-embedding
    image: necom-embedding:latest
    mem_limit: 480m
    networks:
      - backend
    restart: always

  necom-client:
    container_name: necom-client
    build:
      context: ./necom-client
      dockerfile: Dockerfile
    image: necom-client:latest
    ports:
      - "${CLIENT_PORT:-80}:80"
    depends_on:
      - necom-server
    networks:
      - backend
    restart: always

volumes:
  mysql-data:
    driver: local

networks:
  backend:
    driver: bridge
    name: necom-network


