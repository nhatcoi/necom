# ==============================================================================
# 🛍️ NECOM E-COMMERCE PLATFORM - NGINX REVERSE PROXY FOR necom-v1.vnhat.dev (UI v1, nhánh ui-v1)
# ==============================================================================

# 1. HTTP Server - Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name necom-v1.vnhat.dev;

    # Allow Let's Encrypt renewal challenges
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server - Reverse Proxy to Docker Container
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name necom-v1.vnhat.dev;

    # SSL Certificate Configuration
    ssl_certificate /etc/letsencrypt/live/necom-v1.vnhat.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/necom-v1.vnhat.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
