# ==============================================================================
# 🛍️ NECOM E-COMMERCE PLATFORM - necom-v2.vnhat.dev -> REDIRECT 301 VỀ necom.vnhat.dev
# ==============================================================================

# 1. HTTP Server - Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name necom-v2.vnhat.dev;

    # Allow Let's Encrypt renewal challenges
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server - Reverse Proxy to Docker Container
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name necom-v2.vnhat.dev;

    # SSL Certificate Configuration
    ssl_certificate /etc/letsencrypt/live/necom-v2.vnhat.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/necom-v2.vnhat.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    location / {
        return 301 https://necom.vnhat.dev$request_uri;
    }
}
